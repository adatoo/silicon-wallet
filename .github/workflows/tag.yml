name: tag

# Tags each merge to main `vX.Y.Z` from VERSION, as the App so the tag can start release workflows.
on:
  push:
    branches: [main]

permissions: {}

jobs:
  tag:
    uses: ./.github/workflows/tag-on-merge.yml
    with:
      version-file: VERSION
      client-id: ${{ vars.AUTOMATION_APP_CLIENT_ID }}
      runner: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    secrets:
      AUTOMATION_APP_PRIVATE_KEY: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
