# Silicon Wallet's Xcode project (ADR-0001). Edit this file, not SiliconWallet.xcodeproj:
# `task generate` rewrites the project from it, and both are committed.
name: SiliconWallet
options:
  bundleIdPrefix: com.datoos
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

configs:
  Debug: debug
  Release: release

# MARKETING_VERSION comes from VERSION through Config/Version.xcconfig (ADR-0003).
configFiles:
  Debug: Config/Version.xcconfig
  Release: Config/Version.xcconfig

packages:
  SiliconWalletKit:
    path: Packages/SiliconWalletKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    # The build number; the release pipeline sets it per upload (ADR-0003).
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: QKAYS6D525
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES

targets:
  SiliconWallet:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App/Shared
      - path: App/Resources
      - path: App/iOS
        destinationFilters: [iOS]
        excludes: ["**/.gitkeep"]
      - path: App/macOS
        destinationFilters: [macOS]
        excludes: ["**/.gitkeep"]
    dependencies:
      - package: SiliconWalletKit
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Silicon Wallet
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        NSFaceIDUsageDescription: Face ID unlocks your vault without typing your master password.
        NSHumanReadableCopyright: "Copyright © 2026 Arif Datoo. MIT Licence."
        # CKSyncEngine is woken by CloudKit pushes (DESIGN.md §7). Ignored on macOS.
        UIBackgroundModes: [remote-notification]
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # ITSAppUsesNonExemptEncryption is set once the export-compliance answer is
        # settled (docs/app-store-release.md, B5). Until then App Store Connect asks per build.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.datoos.silicon-wallet
        PRODUCT_NAME: SiliconWallet
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        "CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]": App/SiliconWallet-iOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": App/SiliconWallet-iOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": App/SiliconWallet-macOS.entitlements
        ENABLE_HARDENED_RUNTIME: YES
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG

  SiliconWalletTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Tests/SiliconWalletTests
    dependencies:
      - target: SiliconWallet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.datoos.silicon-wallet.tests
        GENERATE_INFOPLIST_FILE: YES
        # XcodeGen writes the iOS host path; a macOS app keeps its binary under Contents/MacOS.
        "TEST_HOST[sdk=macosx*]": $(BUILT_PRODUCTS_DIR)/SiliconWallet.app/Contents/MacOS/SiliconWallet
        TARGETED_DEVICE_FAMILY: "1,2"

schemes:
  SiliconWallet:
    build:
      targets:
        SiliconWallet: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SiliconWalletTests
        - package: SiliconWalletKit/SiliconWalletKitTests
    archive:
      config: Release
